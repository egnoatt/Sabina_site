name: One-off public DNS TXT verification

on:
  pull_request:
    paths:
      - 'scripts/dns_txt_verification.py'
      - '.github/workflows/dns-txt-verification.yml'

permissions:
  contents: read

jobs:
  dns-google-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DNS resolver
        run: python -m pip install dnspython==2.8.0
      - name: Query DNS public TXT from hosted runner
        run: python scripts/dns_txt_verification.py
