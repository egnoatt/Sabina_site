name: Privacy browser inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/privacy/**'
      - 'docs/privacy-*.md'
      - 'scripts/privacy_browser_inventory.py'
      - '.github/workflows/privacy-browser-inventory.yml'

permissions:
  contents: read

jobs:
  privacy-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect production requests and storage, metadata only
        run: python scripts/privacy_browser_inventory.py
      - name: Archive sanitized technical inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabina-privacy-browser-inventory
          path: artifacts/privacy/network-cookie-inventory.json
          if-no-files-found: ignore
          retention-days: 7
