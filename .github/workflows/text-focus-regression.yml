name: Text spacing and keyboard focus

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - '*config*'
      - 'scripts/text_focus_regression.py'
      - '.github/workflows/text-focus-regression.yml'

permissions:
  contents: read

jobs:
  text-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Build local site
        run: npm run build
      - name: Check text spacing, reflow and keyboard focus
        run: python scripts/text_focus_regression.py
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-focus-regression
          path: artifacts/text-focus/
          if-no-files-found: ignore
          retention-days: 7
