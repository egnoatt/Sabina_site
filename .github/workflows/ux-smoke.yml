name: UX browser smoke

on:
  pull_request:
  push:
    branches:
      - codex/sabina-ux-design-20261014

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install site dependencies
        run: npm ci
      - name: Install browser test tooling
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Exercise mobile and desktop layouts
        run: python scripts/ux_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabina-ux-smoke
          path: |
            artifacts/ux/
            next-smoke.log
          if-no-files-found: ignore
          retention-days: 7
